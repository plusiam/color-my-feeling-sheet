<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>마음빚 카드 - 색으로 감정을 이야기하는 놀이</title>
    <meta name="description" content="학생들이 색깔로 감정을 표현하고 나누는 감정 교육 웹 학습지입니다. 이야기 카드를 선택하고, 감정 색깔과 단어를 고르며, 자신의 감정을 표현해보세요." />
    <meta name="author" content="Mind Color Cards" />
    <meta name="keywords" content="감정 교육, 마음 놀이, 감정 카드, 색깔 감정, 학생 학습지, 서버리스 학습지" />

    <meta property="og:title" content="마음빚 카드 - 색으로 감정을 이야기하는 놀이" />
    <meta property="og:description" content="학생들이 색깔로 감정을 표현하고 나누는 감정 교육 웹 학습지" />
    <meta property="og:type" content="website" />

    <!-- GitHub Pages SPA 리다이렉트 핸들러 -->
    <script>
      (function() {
        const query = window.location.search;
        if (query && query.indexOf('?p=/') === 0) {
          const route = query.replace('?p=/', '').split('&')[0];
          const otherQuery = query.split('&').slice(1).join('&');
          window.history.replaceState(
            null,
            null,
            window.location.pathname + (route ? '/' + route : '') + 
            (otherQuery ? '?' + otherQuery : '') +
            window.location.hash
          );
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
